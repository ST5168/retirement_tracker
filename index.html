<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Runway — Retire by 45 Plan</title>
<link rel="stylesheet" href="styles.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2F6E52" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Runway" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
</head>
<body>
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="eyebrow">Runway</div>
    <h1 id="auth-title">Log in</h1>
    <div id="auth-error" class="auth-error"></div>
    <input id="auth-email" type="email" placeholder="Email" autocomplete="email" />
    <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="auth-submit" class="btn btn-primary btn-full">Log in</button>
    <div id="auth-toggle" class="auth-toggle">Need an account? <a href="#" id="auth-toggle-link">Sign up</a></div>
  </div>
</div>

<div id="app" class="app" style="display:none;">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="eyebrow">Runway</div>
        <div id="rw-title" class="month-title">Dashboard</div>
      </div>
      <button id="signout-btn" class="icon-btn" aria-label="Sign out"><i class="ti ti-logout"></i></button>
    </div>
  </div>

  <div class="rw-screen active" data-screen="home" id="screen-home"></div>
  <div class="rw-screen" data-screen="log" id="screen-log"></div>
  <div class="rw-screen" data-screen="bills" id="screen-bills"></div>
  <div class="rw-screen" data-screen="analysis" id="screen-analysis"></div>
  <div class="rw-screen" data-screen="plan" id="screen-plan"></div>

  <div class="tabbar">
    <button class="rw-tabbtn active" data-tab="home"><i class="ti ti-home"></i>Home</button>
    <button class="rw-tabbtn" data-tab="log"><i class="ti ti-plus"></i>Log</button>
    <button class="rw-tabbtn" data-tab="bills"><i class="ti ti-file-invoice"></i>Bills</button>
    <button class="rw-tabbtn" data-tab="analysis"><i class="ti ti-chart-bar"></i>Analysis</button>
    <button class="rw-tabbtn" data-tab="plan"><i class="ti ti-flag"></i>Plan</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@tabler/icons-webfont@latest/dist/tabler-icons.min.js" defer></script>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<script src="config.js"></script>
<script src="projection.js"></script>
<script src="app.js"></script>
</body>
</html>
